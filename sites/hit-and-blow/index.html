<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CHROMA — ヒット＆ブロー</title>
<style>
:root{color-scheme:dark;--bg:#10151d;--panel:#1a2230;--muted:#9caac0;--accent:#b5f57c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0,#26352f,transparent 55%),var(--bg);color:#f2f5fa;font:15px system-ui,sans-serif;min-height:100vh}button,select{font:inherit}button{cursor:pointer;border:1px solid #435064;background:#273345;color:inherit;border-radius:12px;padding:12px 18px;transition:background .15s,transform .15s}button:hover:enabled{background:#394b61;transform:translateY(-2px)}button:disabled{opacity:.35;cursor:not-allowed}button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.primary{background:var(--accent);color:#14220f;border:0;font-weight:750}.primary:hover:enabled{background:#d0ffa8}main{max-width:1100px;margin:auto;padding:36px 24px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px}h1{letter-spacing:.15em;margin:0;font-size:26px}h2{margin:0 0 12px}p{line-height:1.7}.eyebrow{color:var(--accent);letter-spacing:.2em;font-size:12px;font-weight:800}.muted,small{color:var(--muted)}.layout{display:grid;grid-template-columns:1fr 310px;gap:22px}.panel{background:linear-gradient(140deg,#202a39,#18212d);border:1px solid #354053;border-radius:24px;padding:26px;box-shadow:0 16px 60px #0002}.stats{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.stat{background:#0f1722;padding:14px 18px;border-radius:14px;flex:1;min-width:110px}.stat strong{display:block;font-size:24px;margin-top:5px}.slots{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0;min-height:60px}.slot{width:56px;height:56px;border:2px dashed #566174;border-radius:50%;padding:4px;background:#101824;display:grid;place-items:center}.slot.selected{outline:2px solid var(--accent);outline-offset:4px}.chip{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:var(--ink);font-weight:800;border:2px solid #ffffff65;box-shadow:inset 0 -5px 8px #0003,0 4px 8px #0003}.palette{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0}.colorbtn{padding:7px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px}.actions{display:flex;gap:10px;flex-wrap:wrap}.history{max-height:440px;overflow:auto;padding-right:4px}.row{padding:15px 0;border-bottom:1px solid #364152;display:flex;align-items:center;gap:14px;flex-wrap:wrap;animation:appear .3s ease}.row .chip{width:30px;height:30px;font-size:11px}.sequence{display:flex;gap:6px;flex-wrap:wrap}.score{margin-left:auto;font-weight:800;white-space:nowrap}.hit{color:var(--accent)}.blow{color:#8dbdff}.badge{padding:6px 10px;background:#ffffff12;border-radius:8px;font-size:12px}.overlay{position:fixed;inset:0;background:#070e18b8;backdrop-filter:blur(9px);display:flex;align-items:center;justify-content:center;padding:24px;z-index:10;overflow:auto}.dialog{width:min(720px,100%);max-height:94vh;overflow:auto;background:#192330ee;border:1px solid #4a586d;border-radius:28px;padding:34px;box-shadow:0 30px 100px #0007}.dialog h2{font-size:36px;letter-spacing:.05em}.settings{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin:24px 0}label{display:flex;flex-direction:column;gap:8px;color:var(--muted)}select{padding:12px;border-radius:10px;background:#0e1723;color:#fff;border:1px solid #44526a}.modes{display:flex;gap:12px;margin-top:20px}.modes button{flex:1}.modes .active{border-color:var(--accent);color:var(--accent);background:#b5f57c15}.error{color:#ffb3a9;min-height:24px}.hidden{display:none!important}.pop{animation:pop .25s ease}.success{animation:glow .6s ease}.timerlow{color:#ffac9d}@keyframes pop{from{transform:translateY(16px) scale(.7);opacity:0}to{transform:none;opacity:1}}@keyframes appear{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}@keyframes glow{50%{box-shadow:0 0 45px #b5f57c66}}@media(max-width:760px){main{padding:20px 14px}.layout{grid-template-columns:1fr}.dialog{padding:24px}.panel{padding:20px}.slot{width:48px;height:48px}.slot .chip{width:36px;height:36px}.settings{gap:12px}.dialog h2{font-size:28px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<main><header><div><div class="eyebrow">COLOR LOGIC GAME</div><h1>CHROMA</h1><small>ヒット＆ブロー</small></div><button id="exit">タイトルへ</button></header><div class="layout"><section class="panel" id="board"><div class="eyebrow" id="phase">DECODE THE COLORS</div><h2 id="turn">色の並びを推理しよう</h2><div class="muted" id="summary">4個 / 6色 / 重複なし / 最大10回</div><div class="stats"><div class="stat"><small>挑戦回数 / 残り</small><strong id="attempts">—</strong></div><div class="stat"><small>残り時間</small><strong id="timer">—</strong></div></div><p id="hint" class="muted">色を選んで、隠された組み合わせを解読。</p><div class="slots" id="slots"></div><div class="actions"><button id="remove">選択色を削除</button><button id="clear">すべてクリア</button><button class="primary" id="submit">予想を確定</button></div><div class="palette" id="palette"></div><div id="feedback" aria-live="polite"></div></section><aside class="panel"><div class="eyebrow">HOW TO PLAY</div><h2>手がかりは2つ。</h2><p><b class="hit">HIT</b><br><span class="muted">色も位置も一致。</span></p><p><b class="blow">BLOW</b><br><span class="muted">色は一致、位置が違う。</span></p><p class="muted">駒の番号は色の目印です。予想欄の丸をクリックすると、その位置を編集できます。</p><div id="players"></div></aside></div><section class="panel" style="margin-top:22px"><div class="eyebrow">GUESS HISTORY</div><h2 id="historyTitle">予想の履歴</h2><div id="history" class="history"><p class="muted">ここに推理の記録が並びます。</p></div></section></main>
<div class="overlay" id="overlay"><div class="dialog" id="dialog"></div></div>
<script>
'use strict';
const COLORS=[['赤','#f16b72','#251016'],['青','#537be7','#fff'],['緑','#4cb889','#10251c'],['黄','#f0d664','#30280d'],['紫','#a67dde','#22152d'],['オレンジ','#f5a259','#33200d'],['水色','#6cd9e5','#0d2930'],['ピンク','#f3a8d4','#31142a'],['白','#ecf0f6','#27303c'],['黒','#252934','#fff']];
const $=id=>document.getElementById(id);let cfg={mode:'solo',length:4,colors:6,repeat:false,max:10,time:0};let game=null,draft=[],selected=0,phase='title',locked=false,deadline=0,interval=null,token=0;
// Count exact matches first, then intersect only the unmatched color frequencies.
function judge(answer,guess){let hit=0,a={},g={};for(let i=0;i<answer.length;i++){if(answer[i]===guess[i])hit++;else{a[answer[i]]=(a[answer[i]]||0)+1;g[guess[i]]=(g[guess[i]]||0)+1}}let blow=0;for(const c in g)blow+=Math.min(g[c],a[c]||0);return{hit,blow}}
function randomAnswer(c){let pool=Array.from({length:c.colors},(_,i)=>i),out=[];for(let i=0;i<c.length;i++){const n=Math.floor(Math.random()*pool.length);out.push(pool[n]);if(!c.repeat)pool.splice(n,1)}return out}
function chip(c,cls=''){const [name,color,ink]=COLORS[c];return `<span class="chip ${cls}" style="--c:${color};--ink:${ink}" title="${name}" aria-label="${name}">${c+1}</span>`}
function sequence(a){return `<div class="sequence">${a.map(c=>chip(c)).join('')}</div>`}
function summary(){return `${cfg.length}個 / ${cfg.colors}色 / ${cfg.repeat?'重複あり':'重複なし'} / ${cfg.max?'最大'+cfg.max+'回':'回数無制限'} / ${cfg.time?cfg.time+'秒/手番':'時間制限なし'}`}
function difficulty(){let possibilities=1;for(let i=0;i<cfg.length;i++)possibilities*=cfg.repeat?cfg.colors:Math.max(1,cfg.colors-i);let score=Math.log10(possibilities)+(cfg.repeat?.35:0)+(cfg.max?Math.max(-.6,(10-cfg.max)*.12):-.8)+(cfg.time?Math.max(0,(90-cfg.time)/100):0);return score<2.5?'EASY':score<4?'NORMAL':score<6?'HARD':'EXTREME'}
function stopTimer(){clearInterval(interval);interval=null;deadline=0}
function hideOverlay(){$('overlay').classList.add('hidden');$('board').inert=false}
function overlay(html){$('board').inert=true;$('dialog').innerHTML=html;$('overlay').classList.remove('hidden');$('dialog').querySelector('button,select')?.focus()}
function title(){token++;stopTimer();game=null;phase='title';locked=false;draft=[];render();overlay(`<div class="eyebrow">CRACK THE COLOR CODE</div><h2>CHROMA</h2><p class="muted">色を並べて、手がかりを読み解く。<br>ひとりでも、ふたりでも。</p><div class="modes"><button data-mode="solo">1人プレイ</button><button data-mode="duel">対戦プレイ</button></div><div class="settings">${selectHTML('length','答えの個数',[3,4,5,6,7,8],cfg.length)}${selectHTML('colors','使用する色数',[4,5,6,7,8,10],cfg.colors)}${selectHTML('repeat','色の重複',[[0,'重複なし'],[1,'重複あり']],+cfg.repeat)}${selectHTML('max','最大挑戦回数',[[5,'5回'],[8,'8回'],[10,'10回'],[12,'12回'],[15,'15回'],[0,'無制限']],cfg.max)}${selectHTML('time','制限時間 / 各手番',[[0,'なし'],[30,'30秒'],[60,'60秒'],[90,'90秒'],[120,'120秒']],cfg.time)}</div><div class="actions"><span class="badge" id="difficulty"></span></div><p class="error" id="error" aria-live="polite"></p><button class="primary" id="start">ゲーム開始 →</button><p class="muted"><small>対戦はプレイヤー1が先手。先手が当てても後手は同じ回数まで挑戦できます。時間切れも1回に数えます。</small></p>`);document.querySelectorAll('[data-mode]').forEach(b=>{b.onclick=()=>{cfg.mode=b.dataset.mode;updateSettings()}});document.querySelectorAll('.settings select').forEach(s=>s.onchange=()=>{cfg[s.id]=s.id==='repeat'?!!Number(s.value):Number(s.value);updateSettings()});$('start').onclick=start;updateSettings()}
function selectHTML(id,label,values,val){return `<label>${label}<select id="${id}">${values.map(v=>{const [n,text]=Array.isArray(v)?v:[v,v];return `<option value="${n}" ${n===val?'selected':''}>${text}</option>`}).join('')}</select></label>`}
function updateSettings(){document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===cfg.mode));$('difficulty').textContent='難易度 '+difficulty();const invalid=!cfg.repeat&&cfg.length>cfg.colors;$('error').textContent=invalid?'重複なしでは、使用色数を答えの個数以上にしてください。':'';$('start').disabled=invalid}
function start(){token++;stopTimer();game={answers:[null,null],hist:[[],[]],solved:[false,false],player:0,started:0,elapsed:0};locked=false;draft=[];selected=0;if(cfg.mode==='solo'){game.answers[1]=randomAnswer(cfg);game.started=Date.now();hideOverlay();beginTurn()}else{handoff('プレイヤー1へ','相手に画面が見えないことを確認して、秘密の色を設定してください。',()=>setup(0))}}
function handoff(titleText,text,fn){stopTimer();phase='handoff';draft=[];render();$('history').innerHTML='<p class="muted">交代後に現在のプレイヤーの履歴が表示されます。</p>';overlay(`<div class="eyebrow">PASS THE SCREEN</div><h2>${titleText}</h2><p class="muted">${text}</p><button class="primary" id="ready">準備できた →</button>`);$('ready').onclick=()=>{hideOverlay();fn()}}
function setup(p){phase='setup';game.player=p;draft=[];selected=0;locked=false;render()}
function beginTurn(){phase='play';draft=[];selected=0;locked=false;render();if(cfg.time){deadline=Date.now()+cfg.time*1000;tick();interval=setInterval(tick,100)}}
function tick(){if(phase!=='play'||locked)return;const remain=Math.max(0,deadline-Date.now());$('timer').textContent=(remain/1000).toFixed(1)+'s';$('timer').classList.toggle('timerlow',remain<10000);if(remain<=0)resolveGuess(true)}
function editable(){return !locked&&(phase==='setup'||phase==='play')}
function add(c){if(!editable())return;if(phase==='play'&&deadline&&Date.now()>=deadline){resolveGuess(true);return}if(!cfg.repeat&&draft.some((v,i)=>v===c&&i!==selected))return;draft[selected]=c;const next=draft.findIndex(v=>v===undefined);selected=next>=0?next:Math.min(cfg.length-1,selected+1);renderEditor(true)}
function renderEditor(animate=false){$('slots').innerHTML=Array.from({length:cfg.length},(_,i)=>`<button class="slot ${i===selected?'selected':''}" data-slot="${i}" aria-label="${i+1}番目${draft[i]===undefined?' 未選択':' '+COLORS[draft[i]][0]}">${draft[i]===undefined?'<span class="muted">'+(i+1)+'</span>':chip(draft[i],animate?'pop':'')}</button>`).join('');document.querySelectorAll('[data-slot]').forEach(b=>{b.disabled=!editable();b.onclick=()=>{selected=Number(b.dataset.slot);renderEditor()}});$('palette').innerHTML=COLORS.slice(0,cfg.colors).map((c,i)=>`<button class="colorbtn" data-color="${i}" ${!editable()||(!cfg.repeat&&draft.some((v,j)=>v===i&&j!==selected))?'disabled':''}>${chip(i)}<span>${c[0]}</span></button>`).join('');document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>add(Number(b.dataset.color)));$('submit').disabled=!editable()||Array.from({length:cfg.length},(_,i)=>draft[i]).some(v=>v===undefined);$('remove').disabled=!editable()||draft[selected]===undefined;$('clear').disabled=!editable()||!draft.some(v=>v!==undefined);$('submit').textContent=phase==='setup'?'秘密の色を決定':'予想を確定'}
function render(){const p=game?.player||0;$('summary').textContent=summary();$('phase').textContent=phase==='setup'?'SET YOUR SECRET':'DECODE THE COLORS';$('turn').textContent=phase==='setup'?`プレイヤー${p+1}：秘密の色を設定`:phase==='play'?(cfg.mode==='duel'?`プレイヤー${p+1}の手番`:'隠された色を推理しよう'):phase==='result'?'ゲーム終了':'色の並びを推理しよう';$('hint').textContent=phase==='setup'?'相手が当てる答えを作成します。決定すると画面から隠れます。':'丸を選んで位置を指定 → 下の色をクリック。すべて埋めたら確定。';const n=game?.hist[p].length||0;$('attempts').textContent=`${n}回 / ${cfg.max?Math.max(0,cfg.max-n)+'回':'∞'}`;$('timer').textContent=phase==='play'&&cfg.time?cfg.time+'s':'—';$('timer').classList.remove('timerlow');$('feedback').innerHTML='';$('players').innerHTML=cfg.mode==='duel'&&game?`<p class="muted">P1：${game.hist[0].length}回　P2：${game.hist[1].length}回</p>`:'';renderEditor();renderHistory()}
function renderHistory(){const p=game?.player||0;$('historyTitle').textContent=cfg.mode==='duel'?`プレイヤー${p+1}の予想履歴`:'予想の履歴';const hist=game?.hist[p]||[];$('history').innerHTML=hist.length?hist.map((r,i)=>`<div class="row"><small>${i+1}回目</small>${r.timeout?'<span class="muted">時間切れ（失敗）</span>':sequence(r.guess)}<div class="score">${r.timeout?'—':`<span class="hit">${r.hit} HIT</span>　<span class="blow">${r.blow} BLOW</span>`}</div></div>`).reverse().join(''):'<p class="muted">まだ予想がありません。</p>';$('history').scrollTop=0}
function submit(){if(!editable()||Array.from({length:cfg.length},(_,i)=>draft[i]).some(v=>v===undefined))return;if(phase==='setup'){game.answers[game.player]=draft.slice();if(game.player===0)handoff('設定完了。プレイヤー2へ','秘密の色を隠しました。プレイヤー1は画面から目を離してください。',()=>setup(1));else handoff('両者の設定が完了','プレイヤー1へ交代してください。準備できたら第1ラウンドを開始します。',()=>{game.player=0;game.started=Date.now();beginTurn()});return}resolveGuess(!!deadline&&Date.now()>=deadline)}
function resolveGuess(timeout){if(phase!=='play'||locked)return;locked=true;stopTimer();hideOverlay();const p=game.player;const r=timeout?{timeout:true,guess:[]}:{...judge(game.answers[1-p],draft),guess:draft.slice(),timeout:false};game.hist[p].push(r);game.solved[p]=r.hit===cfg.length;renderEditor();renderHistory();$('feedback').innerHTML=timeout?'<p class="error">時間切れ。この手番は失敗です。</p>':`<p class="pop score"><span class="hit">${r.hit} HIT</span>　<span class="blow">${r.blow} BLOW</span>${game.solved[p]?'　✦ 正解！':''}</p>`;if(game.solved[p])$('board').classList.add('success');const current=token;setTimeout(()=>{if(current!==token)return;$('board').classList.remove('success');if(cfg.mode==='solo'){if(game.solved[0]||(cfg.max&&game.hist[0].length>=cfg.max))finish();else beginTurn();return}if(p===1&&(game.solved.some(Boolean)||(cfg.max&&game.hist[1].length>=cfg.max))){finish();return}game.player=1-p;handoff(`プレイヤー${game.player+1}へ`,game.solved[0]?'先手が正解しました。後手にも同じ回数の挑戦があります。':'画面を交代してください。準備完了から制限時間が始まります。',beginTurn)},700)}
function finish(){stopTimer();phase='result';locked=true;game.elapsed=Date.now()-game.started;render();let text;if(cfg.mode==='solo')text=`<div class="eyebrow">${game.solved[0]?'CODE CRACKED':'GAME OVER'}</div><h2>${game.solved[0]?'CLEAR ✦':'FAILED'}</h2><p>正解</p>${sequence(game.answers[1])}<p>挑戦回数：${game.hist[0].length}回<br>経過時間：${formatTime(game.elapsed)}</p>`;else{const winner=game.solved[0]===game.solved[1]?'引き分け':`プレイヤー${game.solved[0]?1:2}の勝ち`;text=`<div class="eyebrow">MATCH RESULT</div><h2>${winner}</h2><p>プレイヤー1の秘密（プレイヤー2が推理）</p>${sequence(game.answers[0])}<p>プレイヤー2の秘密（プレイヤー1が推理）</p>${sequence(game.answers[1])}<p>P1：${game.hist[0].length}回 / P2：${game.hist[1].length}回<br>経過時間：${formatTime(game.elapsed)}</p>`}overlay(text+`<p class="muted">${summary()}</p><div class="actions"><button class="primary" id="again">同じ設定でもう一度</button><button id="change">設定を変更して遊ぶ</button><button id="back">タイトルへ戻る</button></div>`);$('again').onclick=start;$('change').onclick=title;$('back').onclick=title}
function formatTime(ms){let s=Math.floor(ms/1000);return `${Math.floor(s/60)}分${s%60}秒`}
$('submit').onclick=submit;$('remove').onclick=()=>{if(editable()){delete draft[selected];renderEditor()}};$('clear').onclick=()=>{if(editable()){draft=[];selected=0;renderEditor()}};$('exit').onclick=()=>{if(phase==='title'||phase==='result'){title();return}overlay('<h2>ゲームを終了？</h2><p class="muted">現在のゲームの記録は破棄されます。制限時間はこの確認中も進みます。</p><div class="actions"><button id="cancel">続ける</button><button id="quit">タイトルへ戻る</button></div>');$('cancel').onclick=hideOverlay;$('quit').onclick=title};document.addEventListener('keydown',e=>{if(!$('overlay').classList.contains('hidden')||!editable())return;if(e.key==='Enter'){e.preventDefault();submit()}else if(e.key==='Backspace'){e.preventDefault();delete draft[selected];renderEditor()}});title();
</script></html>
