<script>
// Share the portal preference; otherwise follow the operating system.
function syncTheme(){
  let theme='system';
  try{const saved=JSON.parse(localStorage.getItem('ai-web-portal:v1:theme'));if(saved==='light'||saved==='dark')theme=saved}catch{}
  document.documentElement.dataset.theme=theme;
}
syncTheme();
window.addEventListener('storage',event=>{if(event.key==='ai-web-portal:v1:theme'||event.key===null)syncTheme()});
window.addEventListener('pageshow',syncTheme);
</script>
<meta name="description" content="1台で遊ぶ2人用神経衰弱。外部通信なしで遊べます。">

<style>
:root{color-scheme:light;--ink:#203c37;--muted:#71827c;--green:#29685c;--p1:#277769;--p2:#ac673d;--paper:#faf9f4;--line:#dce3db;--surface:#fff;--primary:#29685c;--card-back:#29685c;--sample:#e6eee7;--field:#f8faf7;--soft:#f0f5ef;--player:#edf1eb;--card-line:#dce5da;--matched1:#e7f1e9;--matched2:#faf0e7;--result:#f1f5ee;--backdrop:#18382e88;--shadow:#203c3708;--dialog-shadow:#143d3733}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #cfaa57;outline-offset:4px}button:disabled{cursor:default}button.primary{background:var(--primary);color:white;border:0;border-radius:12px;padding:15px 24px;font-weight:750}button.secondary{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 18px;color:var(--ink)}button:hover:not(:disabled){filter:brightness(.97)}[hidden]{display:none!important}.shell{max-width:1000px;margin:auto;padding:24px 28px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:26px}.brand{font-size:24px;letter-spacing:5px;font-weight:850}.brand small{display:block;font-size:10px;letter-spacing:2px;color:var(--muted);margin-top:3px}.sound{font-size:13px;display:flex;align-items:center;gap:8px}.sound input{accent-color:var(--green);width:17px;height:17px}.intro{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center;min-height:70vh}.eyebrow{font-size:12px;letter-spacing:3px;font-weight:750;color:var(--green)}h1{font-size:clamp(36px,5vw,58px);line-height:1.2;letter-spacing:-2px;margin:18px 0 22px}p{line-height:1.9;color:var(--muted)}.decoration{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:360px;margin-top:34px;transform:rotate(-5deg)}.sample{aspect-ratio:1;border-radius:14px;display:grid;place-items:center;background:var(--sample);font-size:34px} .sample.back{background:var(--card-back);color:#a7c4b4;font-size:28px}.sample:nth-child(3n){transform:translateY(8px)}.panel{background:var(--surface);border:1px solid var(--line);padding:30px;border-radius:24px;box-shadow:0 16px 50px var(--shadow)}.panel h2{font-size:20px;margin:0 0 24px}.field{display:block;margin:18px 0;font-size:13px;font-weight:700}.field input,.field select{display:block;width:100%;margin-top:9px;background:var(--field);border:1px solid var(--line);padding:12px 14px;border-radius:10px;color:var(--ink)}.rule{font-size:12px;line-height:1.8;background:var(--soft);padding:14px;border-radius:12px;margin:22px 0}.wide{width:100%}.players{display:grid;grid-template-columns:1fr 1fr;gap:16px}.player{border:2px solid transparent;background:var(--player);border-radius:16px;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;transition:.3s;min-width:0}.player[data-player="1"]{--accent:var(--p2)}.player[data-player="0"]{--accent:var(--p1)}.player.active{border-color:var(--accent);background:var(--surface);box-shadow:0 4px 18px var(--shadow)}.player.winner{transform:scale(1.025);box-shadow:0 0 25px #d1b75e66}.player .name{font-weight:750;overflow-wrap:anywhere}.tag{color:var(--accent);font-size:11px;font-weight:750;display:block;margin-bottom:4px}.points{font-size:30px;font-weight:800;white-space:nowrap;margin-left:12px}.points small{font-size:12px;font-weight:500;margin-left:5px}.statusbar{display:flex;justify-content:space-between;align-items:center;margin:22px 0 18px;gap:14px;flex-wrap:wrap}.status{font-size:14px;font-weight:700;overflow-wrap:anywhere}.stats{display:flex;gap:16px;color:var(--muted);font-size:12px}.stats b{color:var(--ink);font-variant-numeric:tabular-nums}.board{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:clamp(5px,1.3vw,12px);width:min(100%,var(--board-width));margin:auto}.card{position:relative;aspect-ratio:1/.95;padding:0;border:0;background:none;border-radius:12px;perspective:900px;min-width:0;-webkit-tap-highlight-color:transparent}.inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .38s cubic-bezier(.2,.7,.2,1)}.card.flipped .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;display:grid;place-items:center;border-radius:clamp(7px,1.3vw,13px);backface-visibility:hidden;-webkit-backface-visibility:hidden}.backface{background:var(--card-back);color:#a9c7b8;box-shadow:0 3px 0 #1d4f45}.backface:before{content:"";position:absolute;inset:8px;border:1px solid #ffffff24;border-radius:7px}.backface span{font-size:clamp(15px,3vw,29px)}.frontface{transform:rotateY(180deg);background:var(--surface);border:1px solid var(--card-line);font-size:clamp(22px,4.6vw,47px);box-shadow:0 2px 5px var(--shadow)}.card.matched .frontface{background:var(--matched1);border:2px solid var(--p1)}.card.owner1 .frontface{background:var(--matched2);border-color:var(--p2)}.card.matched .frontface:after{content:"✓";position:absolute;right:5px;top:3px;font-size:12px;color:var(--p1)}.card.owner1 .frontface:after{color:var(--p2)}.card.success{animation:pop .5s ease}.board.finished .card{animation:glow .8s ease}.gamefooter{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:24px;color:var(--muted);font-size:12px}.gamefooter button{font-size:12px}.legend{display:flex;gap:14px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--p1);margin-right:5px}.dot.two{background:var(--p2)}dialog{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:32px;max-width:460px;width:calc(100% - 32px);color:var(--ink);box-shadow:0 24px 100px var(--dialog-shadow)}dialog::backdrop{background:var(--backdrop);backdrop-filter:blur(5px)}.result{text-align:center}.result h2{font-size:30px;overflow-wrap:anywhere;margin:14px 0 24px}.resulticon{font-size:45px}.resultscores{display:grid;grid-template-columns:1fr 1fr;gap:12px}.resultscore{background:var(--result);padding:16px 8px;border-radius:14px;overflow-wrap:anywhere}.resultscore strong{display:block;font-size:30px;margin-top:8px}.resultmeta{font-size:13px;color:var(--muted);margin:20px 0}.actions{display:grid;gap:10px}.subtle{background:none;border:0;padding:10px;color:var(--muted);font-size:13px}@keyframes pop{50%{transform:scale(1.06);filter:drop-shadow(0 0 8px #b5d990)}}@keyframes glow{50%{filter:drop-shadow(0 0 10px #d8ba60);transform:scale(1.025)}}@media(max-width:700px){.shell{padding:18px 16px}.intro{grid-template-columns:1fr;gap:26px;min-height:0}.decoration{display:none}h1{font-size:38px;margin-bottom:14px}.intro p{margin-bottom:0}.panel{padding:23px}.player{padding:12px}.points{font-size:24px}.stats{gap:10px}.gamefooter{align-items:flex-start}.legend{flex-direction:column;gap:5px}header{margin-bottom:20px}}@media(prefers-reduced-motion:reduce){.inner{transition-duration:.01ms}.card.success,.board.finished .card{animation:none}.player{transition:none}}

/* Retain green card backs and distinguish each player’s matched pairs. */
:root[data-theme="dark"]{color-scheme:dark;--ink:#e5eee8;--muted:#a9bbaf;--green:#91d5b9;--p1:#7ed6b8;--p2:#f0b183;--paper:#121b17;--line:#3c5143;--surface:#1e2e25;--primary:#29685c;--card-back:#29685c;--sample:#2b4132;--field:#15231b;--soft:#273c2e;--player:#23352a;--card-line:#4c6453;--matched1:#244c3b;--matched2:#503b2a;--result:#293d30;--backdrop:#060e0ac9;--shadow:#00000024;--dialog-shadow:#00000070}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]):not([data-theme="dark"]){color-scheme:dark;--ink:#e5eee8;--muted:#a9bbaf;--green:#91d5b9;--p1:#7ed6b8;--p2:#f0b183;--paper:#121b17;--line:#3c5143;--surface:#1e2e25;--primary:#29685c;--card-back:#29685c;--sample:#2b4132;--field:#15231b;--soft:#273c2e;--player:#23352a;--card-line:#4c6453;--matched1:#244c3b;--matched2:#503b2a;--result:#293d30;--backdrop:#060e0ac9;--shadow:#00000024;--dialog-shadow:#00000070}}
</style>
</head>
<body>
<main class="shell">
<header><div class="brand">PAIR<small>ふたりの神経衰弱</small></div><label class="sound"><input id="sound" type="checkbox">効果音</label></header>
<section id="title" class="intro">
<div><div class="eyebrow">LOCAL TWO PLAYERS</div><h1>覚えて、めくって。<br>ふたりで、勝負。</h1><p>同じアイコンを見つける記憶のゲーム。<br>ペアを取ったら、もう一度あなたの番。</p><div class="decoration" aria-hidden="true"><div class="sample">🍋</div><div class="sample back">✦</div><div class="sample back">✦</div><div class="sample">🌿</div><div class="sample back">✦</div><div class="sample">🌿</div><div class="sample">🍋</div><div class="sample back">✦</div></div></div>
<form id="setup" class="panel"><h2>ゲームの設定</h2><label class="field">プレイヤー1<input id="name1" maxlength="24" value="Player 1" autocomplete="off"></label><label class="field">プレイヤー2<input id="name2" maxlength="24" value="Player 2" autocomplete="off"></label><label class="field">カード枚数<select id="count"><option value="8">8枚 · 4ペア / 4 × 2</option><option value="12">12枚 · 6ペア / 4 × 3</option><option value="16" selected>16枚 · 8ペア / 4 × 4</option><option value="20">20枚 · 10ペア / 5 × 4</option><option value="24">24枚 · 12ペア / 6 × 4</option><option value="30">30枚 · 15ペア / 6 × 5</option><option value="36">36枚 · 18ペア / 6 × 6</option><option value="48">48枚 · 24ペア / 8 × 6</option></select></label><div class="rule">1回に2枚めくります。ペアなら1点＋続けてプレイ。違ったら相手の番。多くのペアを取った方が勝ち！</div><button class="primary wide" type="submit">ゲームをはじめる →</button></form>
</section>
<section id="game" hidden aria-label="ゲーム盤面">
<div class="players"><div class="player" data-player="0"><div><span class="tag">PLAYER 1</span><span class="name" id="p1name"></span></div><div class="points"><span id="score1">0</span><small>ペア</small></div></div><div class="player" data-player="1"><div><span class="tag">PLAYER 2</span><span class="name" id="p2name"></span></div><div class="points"><span id="score2">0</span><small>ペア</small></div></div></div>
<div class="statusbar"><div id="status" class="status" role="status" aria-live="polite"></div><div class="stats"><span>残り <b id="remaining">0</b> ペア</span><span><b id="cardsCount">0</b> 枚</span><span><b id="moves">0</b> 手</span><span>⏱ <b id="time">00:00</b></span></div></div>
<div class="board" id="board" aria-label="カード"></div><div class="gamefooter"><div class="legend"><span><i class="dot"></i>Player 1 の取得カード</span><span><i class="dot two"></i>Player 2 の取得カード</span></div><button id="leave" class="secondary">ゲームを終了する</button></div>
</section>
</main>
<dialog id="result" class="result" aria-labelledby="resultTitle"><div class="eyebrow">GAME COMPLETE</div><div class="resulticon" id="resultIcon">🏆</div><h2 id="resultTitle"></h2><div class="resultscores"><div class="resultscore"><span id="rName1"></span><strong id="rScore1"></strong>ペア</div><div class="resultscore"><span id="rName2"></span><strong id="rScore2"></strong>ペア</div></div><div id="resultMeta" class="resultmeta"></div><div class="actions"><button id="again" class="primary">同じ設定でもう一度遊ぶ</button><button id="change" class="secondary">設定を変更して遊ぶ</button><button id="home" class="subtle">タイトルへ戻る</button></div></dialog>
<dialog id="confirm" aria-labelledby="confirmTitle"><h2 id="confirmTitle">ゲームを終了しますか？</h2><p>進行中の得点はリセットされます。</p><div class="actions"><button id="cancelLeave" class="primary">ゲームを続ける</button><button id="confirmLeave" class="secondary">終了してタイトルへ</button></div></dialog>
<script>
'use strict';
// 状態管理と表示処理を分け、すべての遅延処理をゲームごとに破棄する。
const $=id=>document.getElementById(id);
const LAYOUT={8:[4,2],12:[4,3],16:[4,4],20:[5,4],24:[6,4],30:[6,5],36:[6,6],48:[8,6]};
const ICONS=['🐱','🐶','🐼','🦊','🐸','🐵','🐧','🦋','🐢','🐬','🍎','🍋','🍇','🍓','🍒','🍉','🥑','🥕','🍄','🍩','🍕','🍦','🌻','🌷','🌵','🌿','⭐','🌙','☀️','🌈','🔥','❄️','🚀','🚲','⚽','🎸','🎈','💎','🔔','🎁'];
let state=null,settings=null,timers=new Set(),clock=null,audio=null;
const FLIP=400;
function later(fn,ms){const id=setTimeout(()=>{timers.delete(id);fn();},ms);timers.add(id);}
function clearTasks(){timers.forEach(clearTimeout);timers.clear();clearInterval(clock);}
function shuffle(items){const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function formatTime(ms){const n=Math.floor(ms/1000);return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`;}
function tone(kind){if(!$('sound').checked)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume().catch(()=>{});const notes=kind==='win'?[523,659,784,1047]:kind==='pair'?[659,880]:[420];notes.forEach((freq,i)=>{const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime+i*.11;o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.055,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+.16);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.18);});}catch{}}
function setStatus(text){$('status').textContent=text;}
function updateScores(){state.scores.forEach((n,i)=>$('score'+(i+1)).textContent=n);$('remaining').textContent=state.count/2-state.scores[0]-state.scores[1];$('moves').textContent=state.moves;document.querySelectorAll('.player').forEach((el,i)=>el.classList.toggle('active',i===state.turn));}
function setCard(index,faceUp){const c=state.cards[index];c.open=faceUp;const el=$('board').children[index];el.classList.toggle('flipped',faceUp);el.setAttribute('aria-label',faceUp?`カード${index+1}：${c.icon}${c.owner!==null?'、取得済み':''}`:`カード${index+1}：裏向き`);el.setAttribute('aria-pressed',String(faceUp));}
function syncControls(){[...$('board').children].forEach((el,i)=>el.disabled=state.locked||state.ended||state.cards[i].open||state.cards[i].owner!==null);}
function start(config){clearTasks();settings={...config,names:[...config.names]};$('result').close();$('confirm').close();const symbols=shuffle(ICONS).slice(0,config.count/2);state={names:[...config.names],count:config.count,cards:shuffle(symbols.flatMap(icon=>[{icon,open:false,owner:null},{icon,open:false,owner:null}])),scores:[0,0],turn:0,selected:[],moves:0,locked:false,ended:false,start:performance.now(),elapsed:0};$('title').hidden=true;$('game').hidden=false;$('board').classList.remove('finished');document.querySelectorAll('.player').forEach(el=>el.classList.remove('winner'));state.names.forEach((name,i)=>$('p'+(i+1)+'name').textContent=name);$('cardsCount').textContent=state.count;$('board').style.setProperty('--cols',LAYOUT[state.count][0]);$('board').style.setProperty('--board-width',Math.min(820,LAYOUT[state.count][0]*116)+'px');$('board').replaceChildren();state.cards.forEach((c,i)=>{const el=document.createElement('button');el.type='button';el.className='card';el.setAttribute('aria-label',`カード${i+1}：裏向き`);el.setAttribute('aria-pressed','false');el.innerHTML='<span class="inner"><span class="face backface" aria-hidden="true"><span>✦</span></span><span class="face frontface" aria-hidden="true"></span></span>';// 裏向きの間はDOMにもアイコンを置かない。
el.addEventListener('click',()=>choose(i));$('board').append(el);});updateScores();setStatus(`${state.names[0]} の番 · 1枚目をめくってください`);$('time').textContent='00:00';clock=setInterval(()=>{if(state&&!state.ended)$('time').textContent=formatTime(performance.now()-state.start);},250);syncControls();$('board').children[0].focus();}
function choose(index){if(!state||state.ended||state.locked)return;const card=state.cards[index];if(card.open||card.owner!==null||state.selected.length>=2)return;$('board').children[index].querySelector('.frontface').textContent=card.icon;setCard(index,true);tone('flip');state.selected.push(index);if(state.selected.length===1){setStatus(`${state.names[state.turn]} の番 · 2枚目をめくってください`);syncControls();return;}state.locked=true;state.moves++;updateScores();syncControls();setStatus('2枚のカードを確認中…');later(judge,FLIP);}
function judge(){const [a,b]=state.selected;const matched=state.cards[a].icon===state.cards[b].icon;if(matched){state.scores[state.turn]++;[a,b].forEach(i=>{state.cards[i].owner=state.turn;const el=$('board').children[i];el.classList.add('matched','success','owner'+state.turn);setCard(i,true);});tone('pair');updateScores();const complete=state.scores[0]+state.scores[1]===state.count/2;if(complete){finish();return;}setStatus(`ペア成立！ ${state.names[state.turn]} が続けてプレイ`);later(()=>{[a,b].forEach(i=>$('board').children[i].classList.remove('success'));state.selected=[];state.locked=false;syncControls();focusNext();},500);}else{setStatus('ペアではありません · 次は相手の番');later(()=>{[a,b].forEach(i=>setCard(i,false));later(()=>{[a,b].forEach(i=>$('board').children[i].querySelector('.frontface').textContent='');state.selected=[];state.turn=1-state.turn;state.locked=false;updateScores();setStatus(`${state.names[state.turn]} の番 · 1枚目をめくってください`);syncControls();focusNext();},FLIP);},1000);}}
function focusNext(){const next=[...$('board').children].find(el=>!el.disabled);if(next)next.focus({preventScroll:true});}
function finish(){state.ended=true;state.locked=true;state.elapsed=performance.now()-state.start;clearInterval(clock);$('time').textContent=formatTime(state.elapsed);syncControls();const winner=state.scores[0]===state.scores[1]?-1:state.scores[0]>state.scores[1]?0:1;setStatus(winner<0?'全ペア取得！ 引き分けです':`全ペア取得！ ${state.names[winner]} の勝利！`);$('board').classList.add('finished');if(winner>=0)document.querySelectorAll('.player')[winner].classList.add('winner');tone('win');later(()=>{$('resultTitle').textContent=winner<0?'引き分け':`${state.names[winner]} の勝利！`;$('resultIcon').textContent=winner<0?'🤝':'🏆';state.names.forEach((name,i)=>{$('rName'+(i+1)).textContent=name;$('rScore'+(i+1)).textContent=state.scores[i];});$('resultMeta').textContent=`${state.count}枚 / ${state.moves}手 / プレイ時間 ${formatTime(state.elapsed)}`;$('result').showModal();},1100);}
function title(focusSettings=false){clearTasks();state=null;$('result').close();$('confirm').close();$('game').hidden=true;$('title').hidden=false;if(settings){$('name1').value=settings.names[0];$('name2').value=settings.names[1];$('count').value=settings.count;}(focusSettings?$('name1'):$('setup').querySelector('button')).focus();}
$('setup').addEventListener('submit',e=>{e.preventDefault();const count=Number($('count').value);if(!Number.isInteger(count)||count%2||!LAYOUT[count])return;start({names:[$('name1').value.trim()||'Player 1',$('name2').value.trim()||'Player 2'],count});});
$('again').onclick=()=>start(settings);$('change').onclick=()=>title(true);$('home').onclick=()=>title();$('leave').onclick=()=>$('confirm').showModal();$('cancelLeave').onclick=()=>$('confirm').close();$('confirmLeave').onclick=()=>title();$('result').addEventListener('cancel',e=>e.preventDefault());
</script>
</body>
</html>
