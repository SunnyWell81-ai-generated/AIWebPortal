<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AIでつくったWebサイト、ツール、ゲームをひとつの場所に。あなたのWebライブラリ。" />
    <meta name="color-scheme" content="light dark" />
    <title>AI Web Portal — Webライブラリ</title>
    <link rel="icon" href="data:," />
    <script>
      // First-paint read only. All writes and validated application reads live in storage.js.
      try {
        const mode = JSON.parse(localStorage.getItem('ai-web-portal:v1:theme'));
        document.documentElement.dataset.theme = ['light', 'dark'].includes(mode) ? mode : 'system';
      } catch { document.documentElement.dataset.theme = 'system'; }
    </script>
    <script type="module" crossorigin src="./assets/index-Ccn6QxGx.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-cpfET-GO.css">
  </head>
  <body>
    <a class="skip-link" href="#main">コンテンツへ移動</a>
    <header class="site-header">
      <div class="header-inner">
        <h1 class="brand"><a href="./" aria-label="AI Web Portal ホーム">AI Web Portal</a></h1>
        <div class="header-actions">
          <button id="header-favorites" class="text-button" type="button" aria-label="お気に入りを表示">お気に入り</button>
          <span class="header-divider" aria-hidden="true"></span>
          <label class="theme-control"><span class="sr-only">カラーテーマ</span><select id="theme"><option value="system">システム</option><option value="light">ライト</option><option value="dark">ダーク</option></select></label>
        </div>
      </div>
    </header>
    <main id="main" class="main" tabindex="-1">
      <section class="library" aria-label="Webサイトライブラリ">
        <div class="library-heading">
          <nav class="view-nav" aria-label="ライブラリの表示">
            <button type="button" data-view="all" class="view-button" aria-pressed="true">すべて<span id="all-count" class="count">0</span></button>
            <button type="button" data-view="favorites" class="view-button" aria-pressed="false">お気に入り<span id="favorite-count" class="count">0</span></button>
            <button type="button" data-view="recent" class="view-button" aria-pressed="false">最近開いた</button>
          </nav>
          <span class="library-label">PERSONAL COLLECTION</span>
        </div>
        <div class="toolbar">
          <div class="search-field"><label class="sr-only" for="search">サイト名・説明を検索</label><input id="search" type="search" placeholder="サイト名やキーワードで検索…" autocomplete="off" maxlength="500" /><button id="clear-search" type="button" class="text-button" aria-label="検索文字列をクリア" hidden>クリア</button></div>
          <div class="sort-control"><label for="sort">並び替え</label><select id="sort"><option value="newest">新着順</option><option value="name-asc">名前の昇順</option><option value="name-desc">名前の降順</option><option value="recent">最近開いた順</option></select></div>
        </div>
        <div id="categories" class="categories" role="group" aria-label="カテゴリで絞り込み"></div>
        <div class="results-heading"><h2 id="results-title">すべてのサイト</h2><p id="result-count" role="status" aria-live="polite" aria-atomic="true">読み込み中…</p></div>
        <p id="storage-notice" class="notice" role="status" hidden>ブラウザへの保存が利用できません。お気に入り・履歴・テーマはこのページを開いている間だけ保持されます。</p>
        <div id="site-grid" class="site-grid" aria-label="サイト一覧" aria-busy="true"></div>
        <div id="empty-state" class="empty-state" hidden>
          <h3 id="empty-title">ライブラリは、ここから。</h3>
          <p id="empty-description">最初のサイトを追加すると、ここに表示されます。</p>
          <p id="empty-hint" class="empty-hint"><code>public/sites/サイト名/index.html</code></p>
          <button id="reset-filters" class="secondary-button" type="button" hidden>絞り込みをリセット</button>
          <button id="retry" class="secondary-button" type="button" hidden>もう一度読み込む</button>
        </div>
        <noscript><p class="notice">一覧を表示するにはJavaScriptを有効にしてください。各サイトは、それぞれのURLから直接開くこともできます。</p></noscript>
      </section>
    </main>
    <footer class="site-footer"><span>AI Web Portal<span class="footer-dot"> / </span>小さなアイデアを、かたちに。</span><span>Built to explore.</span></footer>
  </body>
</html>
